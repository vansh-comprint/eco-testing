# EcoTribe Production Nginx Config
# Place at: /etc/nginx/sites-available/ecotribe
# Symlink:  ln -s /etc/nginx/sites-available/ecotribe /etc/nginx/sites-enabled/
# Test:     nginx -t
# Reload:   systemctl reload nginx

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name ecotribe.co www.ecotribe.co api-wrapper.ecotribe.co;
    return 301 https://$host$request_uri;
}

# API Wrapper — proxies API requests to the FastAPI backend
server {
    listen 443 ssl http2;
    server_name api-wrapper.ecotribe.co;

    ssl_certificate     /etc/letsencrypt/live/ecotribe.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecotribe.co/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 10M;

    # Backend API
    location /api/v1/ {
        proxy_pass http://127.0.0.1:2228/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Backend file storage
    location /storage/ {
        proxy_pass http://127.0.0.1:2228/storage/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:2228/health;
    }

    # Reject everything else
    location / {
        return 404;
    }
}

# Frontend — serves the React SPA only (no API proxy)
server {
    listen 443 ssl http2;
    server_name ecotribe.co www.ecotribe.co;

    ssl_certificate     /etc/letsencrypt/live/ecotribe.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecotribe.co/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 10M;

    # Frontend — React SPA on port 1228
    location / {
        proxy_pass http://127.0.0.1:1228;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }
}
