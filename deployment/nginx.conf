# EcoTribe Production Nginx Config
# Place at: /etc/nginx/sites-available/ecotribe
# Symlink:  ln -s /etc/nginx/sites-available/ecotribe /etc/nginx/sites-enabled/
# Test:     nginx -t
# Reload:   systemctl reload nginx

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name ecotribe.co www.ecotribe.co api-wrapper.ecotribe.co;
    return 301 https://$host$request_uri;
}

# API Wrapper — proxies API requests to the FastAPI backend
server {
    listen 443 ssl http2;
    server_name api-wrapper.ecotribe.co;

    ssl_certificate     /etc/letsencrypt/live/ecotribe.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecotribe.co/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 10M;

    # Backend API — no caching, pass through to FastAPI
    location /api/v1/ {
        proxy_pass http://127.0.0.1:2228/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Ensure API responses are never cached by browser or intermediaries
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        add_header Pragma "no-cache" always;
    }

    # Backend file storage
    location /storage/ {
        proxy_pass http://127.0.0.1:2228/storage/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:2228/health;
    }

    # Swagger / ReDoc / OpenAPI schema
    location /docs {
        proxy_pass http://127.0.0.1:2228/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /redoc {
        proxy_pass http://127.0.0.1:2228/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /openapi.json {
        proxy_pass http://127.0.0.1:2228/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reject everything else
    location / {
        return 404;
    }
}

# Frontend — serves the React SPA only (no API proxy)
server {
    listen 443 ssl http2;
    server_name ecotribe.co www.ecotribe.co;

    ssl_certificate     /etc/letsencrypt/live/ecotribe.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecotribe.co/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 10M;

    # Swagger / ReDoc — proxy to backend
    location /docs {
        proxy_pass http://127.0.0.1:2228/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /redoc {
        proxy_pass http://127.0.0.1:2228/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /openapi.json {
        proxy_pass http://127.0.0.1:2228/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend — React SPA on port 1228
    location / {
        proxy_pass http://127.0.0.1:1228;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;
        error_page 404 = /index.html;

        # HTML should never be cached (ensures users get latest deploy)
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Vite hashed assets — cache forever (hash changes on rebuild)
    location /assets/ {
        proxy_pass http://127.0.0.1:1228;
        proxy_set_header Host $host;

        # Vite adds content hashes to filenames, safe to cache long-term
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
